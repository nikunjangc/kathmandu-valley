<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Kathmandu Valley</title>
    <meta
      name="description"
      content="An endless, procedurally generated ink scroll of the Kathmandu Valley, built on Lingdong Huang's {Shan, Shui}*."
    />
    <style>
      :root {
        --ink: #4b4743;
        --ink-soft: rgba(70, 64, 58, 0.62);
        --rule: rgba(70, 64, 58, 0.22);
        --seal: #b03a2e;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        background: #f0e4cc;
        color: var(--ink);
        font-family: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
        -webkit-tap-highlight-color: transparent;
      }
      header {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: max(12px, env(safe-area-inset-top)) 18px 10px;
      }
      .seal {
        flex: none;
        width: 38px;
        height: 38px;
        display: grid;
        place-items: center;
        border-radius: 4px;
        background: var(--seal);
        color: #f6ead6;
        font-family: "Noto Serif Devanagari", "Kohinoor Devanagari", "Devanagari Sangam MN", "Mangal", serif;
        font-size: 11px;
        line-height: 1.05;
        text-align: center;
        box-shadow: inset 0 0 0 2px rgba(246, 234, 214, 0.35);
        opacity: 0.88;
        transform: rotate(-3deg);
      }
      h1 {
        margin: 0;
        font-size: 19px;
        font-weight: normal;
        letter-spacing: 0.05em;
      }
      .sub {
        margin: 2px 0 0;
        font-size: 12.5px;
        font-style: italic;
        color: var(--ink-soft);
      }
      .sub a {
        color: inherit;
      }
      #stage {
        position: relative;
        flex: 1;
        min-height: 160px;
        display: flex;
        align-items: center;
        overflow: hidden;
        border-top: 1px solid var(--rule);
        border-bottom: 1px solid var(--rule);
        touch-action: none;
        cursor: grab;
        user-select: none;
        -webkit-user-select: none;
      }
      #stage.dragging {
        cursor: grabbing;
      }
      #painting {
        display: block;
        flex: none;
        mix-blend-mode: multiply;
        will-change: transform;
      }
      #loading {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        font-style: italic;
        font-size: 15px;
        color: var(--ink-soft);
        pointer-events: none;
        transition: opacity 0.8s;
      }
      nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 10px 14px max(10px, env(safe-area-inset-bottom));
      }
      nav button,
      nav a,
      nav input {
        font: inherit;
        font-size: 14px;
        color: var(--ink);
        background: transparent;
        border: 1px solid var(--rule);
        border-radius: 3px;
        height: 36px;
        min-width: 36px;
        padding: 0 11px;
      }
      nav button,
      nav a {
        cursor: pointer;
        display: inline-grid;
        place-items: center;
        text-decoration: none;
      }
      nav button:hover,
      nav a:hover {
        background: rgba(70, 64, 58, 0.07);
      }
      nav button:focus-visible,
      nav a:focus-visible,
      nav input:focus-visible {
        outline: 2px solid var(--ink-soft);
        outline-offset: 1px;
      }
      nav form {
        display: flex;
        gap: 6px;
        margin: 0;
      }
      nav input {
        width: 104px;
        padding: 0 8px;
        background: rgba(255, 255, 255, 0.25);
      }
      .gap {
        width: 10px;
      }
      @media (max-width: 560px) {
        header {
          padding-left: 14px;
        }
        h1 {
          font-size: 17px;
        }
        .gap {
          display: none;
        }
        nav {
          gap: 6px;
        }
        nav button,
        nav a {
          padding: 0 9px;
        }
      }
      @media (max-height: 460px) {
        header {
          padding-top: 6px;
          padding-bottom: 4px;
        }
        .sub {
          display: none;
        }
        nav {
          padding-top: 6px;
          padding-bottom: 6px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="seal" lang="ne" aria-hidden="true">काठ<br />माडौं</div>
      <div>
        <h1>Kathmandu Valley</h1>
        <p class="sub">
          an endless ink scroll · after <a href="https://github.com/LingDong-/shan-shui-inf">{Shan, Shui}*</a>
        </p>
      </div>
    </header>

    <main
      id="stage"
      role="img"
      aria-label="An ink painting of the Kathmandu Valley: Himalayan peaks, forested hills, temples and stupas. Drag or scroll sideways to travel."
    >
      <svg id="painting" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none"><g id="ink"></g></svg>
      <div id="loading">grinding ink…</div>
    </main>

    <nav aria-label="Controls">
      <button id="left" title="Travel west (←)" aria-label="Travel west">〈</button>
      <button id="play" title="Auto-scroll (space)" aria-label="Auto-scroll" aria-pressed="false">▶</button>
      <button id="right" title="Travel east (→)" aria-label="Travel east">〉</button>
      <span class="gap"></span>
      <form id="seedform">
        <input id="seed" aria-label="Seed" inputmode="numeric" autocomplete="off" spellcheck="false" />
        <button type="submit" title="Paint this seed">Paint</button>
      </form>
      <button id="dice" title="New random seed" aria-label="New random seed">⟳</button>
      <span class="gap"></span>
      <button id="svg" title="Download this view as SVG">SVG</button>
      <button id="png" title="Download this view as PNG">PNG</button>
      <a href="https://github.com/nikunjangc/kathmandu-valley" title="Source on GitHub" aria-label="Source on GitHub">&lt;/&gt;</a>
    </nav>

    <script data-kv src="src/shanshui.js"></script>
    <script data-kv src="src/kathmandu.js"></script>
    <script data-kv src="src/valley.js"></script>
    <script src="src/app.js"></script>
  </body>
</html>
